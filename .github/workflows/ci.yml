# First run still pending. Linux under Xvfb is what was tested by hand; Windows/macOS results are unknown until it runs.
name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
      - name: Private virtualenv (Linux)
        if: runner.os == 'Linux'
        # the runner's own Python folder and binary are world-writable, which the tools registry refuses by design: use a private copy, not a symlink
        run: python -m venv --copies "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: pip install "git+https://github.com/CellMigrationLab/LabConstrictor-Tools" -e ".[test]"
      - name: Tests (Linux)
        if: runner.os == 'Linux'
        working-directory: tests
        run: |
          python test_units.py
          xvfb-run -a python test_widget.py
          xvfb-run -a python test_file_sources.py
          xvfb-run -a python test_run_state.py
      - name: Tests (Windows/macOS)
        if: runner.os != 'Linux'
        shell: bash
        env:
          QT_OPENGL: software
        working-directory: tests
        run: |
          python test_units.py
          # test_widget.py and test_file_sources.py open a napari viewer: on the Windows runner (no GPU) vispy fails with
          # a GL "invalid operation", so they run on Linux (Xvfb) and macOS only until a software GL is set up for Windows
          if [ "$RUNNER_OS" != "Windows" ]; then python test_widget.py; python test_file_sources.py; fi
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install black==26.10.0 ruff==0.16.10 mypy==1.20.2
      - run: black --check . && ruff check .
      # no package dependencies installed on purpose: missing imports are `Any` (ignore_missing_imports), so this checks our own code only
      - run: mypy napari_labconstrictor
