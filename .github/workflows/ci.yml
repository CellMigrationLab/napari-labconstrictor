# First run still pending. Linux under Xvfb is what was tested by hand; Windows/macOS results are unknown until it runs.
name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
      - name: Private virtualenv (Linux)
        if: runner.os == 'Linux'
        # the runner's own Python folder and binary are world-writable, which the tools registry refuses by design: use a private copy, not a symlink
        run: python -m venv --copies "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: pip install "git+https://github.com/CellMigrationLab/LabConstrictor-Tools" -e ".[test]"
      - name: Tests (Linux)
        if: runner.os == 'Linux'
        working-directory: tests
        run: |
          python test_units.py
          xvfb-run -a python test_widget.py
          xvfb-run -a python test_file_sources.py
          xvfb-run -a python test_run_state.py
      - name: Mesa llvmpipe software OpenGL (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          MESA_VERSION: "24.2.7"
          MESA_SHA256: adbb439c1bf833a1e24a735a6dea3c3ceaf8459dfddd811a12f5aa5c832ad3fe
        run: |
          curl -fsSL -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_VERSION}/mesa3d-${MESA_VERSION}-release-msvc.7z"
          echo "${MESA_SHA256}  mesa.7z" | sha256sum -c -
          7z x mesa.7z -omesa -y > /dev/null
          ls mesa mesa/x64
          # an opengl32.dll next to python.exe wins over the system one (DLL search order)
          PYDIR="$(dirname "$(python -c 'import sys; print(sys.executable)')")"
          cp mesa/x64/opengl32.dll mesa/x64/libgallium_wgl.dll mesa/x64/libglapi.dll "$PYDIR"/
          echo "GALLIUM_DRIVER=llvmpipe" >> "$GITHUB_ENV"
          echo "QT_OPENGL=desktop" >> "$GITHUB_ENV"
      - name: Tests (Windows/macOS)
        if: runner.os != 'Linux'
        shell: bash
        working-directory: tests
        run: |
          # macOS: Qt software rendering; Windows: QT_OPENGL=desktop was exported by the Mesa step (empty values are invalid)
          if [ "$RUNNER_OS" = "macOS" ]; then export QT_OPENGL=software; fi
          python test_units.py
          python test_widget.py
          python test_file_sources.py
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install black==26.10.0 ruff==0.16.10
      - run: black --check . && ruff check .
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # the real napari, magicgui and Qt (PyQt5) are installed on purpose, so mypy checks our calls against their typed signatures;
      # nothing is run and no display is needed. The pins are the versions the code was checked against: raise them together
      - run: >
          pip install mypy==1.20.2 napari==0.9.2 magicgui==0.10.2 PyQt5==5.15.11 qtpy==2.4.3
          "git+https://github.com/CellMigrationLab/LabConstrictor-Tools" -e .
      - run: mypy napari_labconstrictor
